<!doctype html>
<html lang="en">
<head>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('robis.theme')==='dark'?'dark':'light'}catch(e){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00a2ff">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/img/icon-192.png">
<title>Robis Studio</title>
<link rel="icon" href="/img/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/vendor/codemirror/lib/codemirror.css">
<link rel="stylesheet" href="/css/studio.css">
<link rel="stylesheet" href="/css/game.css">
<script src="/vendor/codemirror/lib/codemirror.js"></script>
<script src="/vendor/codemirror/mode/lua/lua.js"></script>
<script src="/vendor/codemirror/addon/edit/matchbrackets.js"></script>
<script src="/vendor/codemirror/addon/edit/closebrackets.js"></script>
<script src="/vendor/codemirror/addon/selection/active-line.js"></script>
<script src="/vendor/codemirror/addon/search/searchcursor.js"></script>
<script src="/vendor/codemirror/addon/comment/comment.js"></script>
<script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
<script type="module" src="/js/i18n.js"></script>
</head>
<body>
<div id="studio">
  <div class="ribbon-tabs">
    <button class="file-btn" id="file-btn">FILE</button>
    <div id="ribbon-tab-list" class="tab-list"></div>
    <div class="spacer"></div>
    <div class="studio-user" id="studio-user"></div>
  </div>
  <div class="ribbon" id="ribbon"></div>
  <div class="main">
    <aside class="panel-left" id="toolbox-panel">
      <div class="panel-title">Toolbox <button class="panel-close" data-panel="toolbox" title="Close">×</button></div>
      <input class="panel-filter" id="toolbox-filter" placeholder="Search models">
      <div class="toolbox-grid" id="toolbox"></div>
    </aside>
    <section class="center">
      <div class="doc-tabs" id="doc-tabs"></div>
      <div class="doc-area" id="doc-area">
        <div class="viewport" id="viewport"></div>
      </div>
      <div class="bottom" id="output-panel">
        <div class="panel-title">Output <button class="mini-btn" id="output-clear">Clear</button><button class="panel-close" data-panel="output" title="Close">×</button></div>
        <div class="output" id="output"></div>
      </div>
      <form class="command-bar" id="command-bar"><textarea id="command-input" rows="1" spellcheck="false" placeholder="Run a command (Lua runs on the test server while playing). Shift+Enter: new line"></textarea></form>
    </section>
    <aside class="panel-right" id="right-panels">
      <div class="explorer-panel" id="explorer-panel">
        <div class="panel-title">Explorer <button class="panel-close" data-panel="explorer" title="Close">×</button></div>
        <input class="panel-filter" id="explorer-filter" placeholder="Filter workspace (Ctrl+Shift+X)">
        <div class="explorer" id="explorer" tabindex="0"></div>
      </div>
      <div class="splitter" id="right-splitter"></div>
      <div class="properties-panel" id="properties-panel">
        <div class="panel-title">Properties <span class="prop-target" id="prop-target"></span><button class="panel-close" data-panel="properties" title="Close">×</button></div>
        <input class="panel-filter" id="properties-filter" placeholder="Filter Properties (Ctrl+Shift+P)">
        <div class="properties" id="properties"></div>
      </div>
    </aside>
  </div>
  <div class="statusbar" id="statusbar"><span id="status-text">Ready</span><span class="spacer"></span><span id="status-right"></span></div>
</div>
<script type="module" src="/js/studio/studio.js"></script>
</body>
</html>
