<!doctype html>
<html lang="en">
<head>
<script>try{var t=localStorage.getItem('robis.theme'),d=document.documentElement;d.dataset.theme=t==='dark'||t==='halloween'?'dark':'light';if(t==='halloween')d.dataset.skin='halloween'}catch(e){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#00a2ff">
<title>Robis - Offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f2f4f5; color: #393b3d; font-family: 'Source Sans Pro', 'Segoe UI', Arial, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  img { width: 180px; margin-bottom: 20px; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: #666; margin: 0 0 20px; }
  button { background: #00b06f; color: #fff; border: 0; border-radius: 6px; font-size: 18px; font-weight: 700; padding: 10px 28px; cursor: pointer; }
</style>
<script type="module" src="/js/i18n.js"></script>
</head>
<body>
<div>
  <img src="/img/icon.svg" alt="ROBIS" style="width: 96px">
  <h1>Can't reach the Robis server</h1>
  <p>Check your internet connection. If it is fine, the server may be restarting for an update: try again in a minute.</p>
  <button onclick="location.reload()">Try again</button>
  <p id="auto" style="margin-top:14px;font-size:13px"></p>
</div>
<script>
// Keep checking: as soon as the server answers again, reload by itself.
(function () {
  var n = 0, el = document.getElementById('auto');
  setInterval(function () {
    n++;
    el.textContent = 'Checking again... (' + n + ')';
    fetch('/api/stats', { cache: 'no-store' }).then(function (r) { if (r.ok) location.reload(); }).catch(function () {});
  }, 5000);
})();
</script>
</body>
</html>
