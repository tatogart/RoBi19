import { GameClient } from '/js/game/client.js';

const params = new URLSearchParams(location.search);
const placeId = +params.get('placeId');
const me = await getMe();
if (!me) location.href = '/?returnUrl=' + encodeURIComponent(location.pathname + location.search);
let gameInfo = null;
try { gameInfo = (await (await fetch(`/api/games/${placeId}`)).json()).game; } catch { /* shown by the client */ }

client.start();
window.robis = client;
