<!doctype html>
<html lang="en">
<head>
<script>try{var t=localStorage.getItem('robis.theme'),d=document.documentElement;d.dataset.theme=t==='dark'||t==='halloween'?'dark':'light';if(t==='halloween')d.dataset.skin='halloween'}catch(e){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2e3136">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/img/icon-192.png">
<title>Robis Player</title>
<link rel="icon" href="/img/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/css/game.css">
<style>html, body { margin: 0; background: #000; overflow: hidden; height: 100%; overscroll-behavior: none; }</style>
<script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
<script type="module" src="/js/i18n.js"></script>
</head>
<body>
<script type="module">
import { GameClient } from '/js/game/client.js';
import { getMe } from '/js/site/api.js';

const params = new URLSearchParams(location.search);
const placeId = +(params.get('placeId') || params.get('id'));
const room = params.get('room');
const me = await getMe();
if (!me) location.href = '/?returnUrl=' + encodeURIComponent(location.pathname + location.search);
let gameInfo = null;
if (!room) try { gameInfo = (await (await fetch(`/api/games/${placeId}`)).json()).game; } catch { /* shown by the client */ }
if (gameInfo) document.title = `${gameInfo.name} - Robis`;

// Rooms: play together in the phone/PC app (see js/game/rooms.js).
let rooms = null;
if (window.ROBIS_STANDALONE && (room || params.get('host'))) rooms = await import('/js/game/rooms.js');
if (rooms && room) window.ROBIS_ROOM_SOCKET = () => new rooms.RoomSocket(room);

function roomBadge() {
  const box = document.createElement('div');
  box.className = 'room-badge';
  box.innerHTML = '<div class="room-title">Opening room...</div>';
  document.body.append(box);
  return box;
}

async function openRoom(welcome) {
  const box = roomBadge();
  try {
    const r = await rooms.hostRoom({
      placeId, serverId: welcome.serverId, name: welcome.name,
      onGuests: (names) => { box.querySelector('.room-guests').textContent = names.length ? 'Here: ' + names.join(', ') : 'Waiting for friends...'; },
    });
    box.innerHTML = `<div class="room-title">Room code</div><div class="room-code">${r.code}</div>
      <div class="room-guests">Waiting for friends...</div><div class="room-hint">Friends: Home → "Join a friend" → enter the code</div>
      <button class="room-share">Share</button>`;
    box.querySelector('.room-share').onclick = async () => {
      const text = `Join my Robis game! Code: ${r.code}`;
      try { if (navigator.share) await navigator.share({ text }); else { await navigator.clipboard.writeText(r.code); box.querySelector('.room-share').textContent = 'Copied!'; } } catch { /* cancelled */ }
    };
    addEventListener('pagehide', () => r.close());
  } catch (e) {
    box.innerHTML = `<div class="room-title">Room not available</div><div class="room-hint">${String(e.message || e).replace(/</g, '&lt;')}</div>`;
  }
}

const client = new GameClient(document.body, {
  placeId: room ? 0 : placeId, serverId: params.get('serverId'), privateId: params.get('private'), place: params.get('place'), gameInfo,
  onWelcome: rooms && !room ? openRoom : null,
});
client.start();
window.robis = client;
// Inside a Discord Activity: "Playing <game>" in the player's Discord status.
import('/js/discord.js').then(async (d) => {
  if (!d.inDiscord()) return;
  const site = await fetch('/api/site').then((r) => r.json()).catch(() => null);
  if (site && site.discord) d.setDiscordStatus(site.discord.appId, `Playing ${gameInfo?.name || 'a game'}`, gameInfo?.creator?.username ? `by ${gameInfo.creator.username}` : 'On Robis');
});
if (me) import('/js/site/invites.js').then((m) => m.startInvites());
</script>
</body>
</html>
